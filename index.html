<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    background: #fff0f3;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #2b2d42;
}

#screen {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* ---------------- TEXT ---------------- */

.opening-text {
    font-size: 15px;
    font-weight: bold;
    background: #fff0f3;
    color: #2b2d42;
    max-width: 350px;
    line-height: 1.4;
    margin-bottom: 30px;
}

.are-you-sure {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 25px;
}

.birthday-title {
    font-size: 20px;
    font-weight: bold;
    color: #d90429;
    max-width: 350px;
    line-height: 1.3;
    margin-bottom: 20px;
}

.birthday-subtitle {
    font-size: 13px;
    color: #2b2d42;
    max-width: 350px;
    line-height: 1.4;
}

/* ---------------- BUTTONS ---------------- */

.button-row {
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    border: none;
    border-radius: 2px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 15px;
    min-width: 90px;
    cursor: pointer;
}

.yes-button {
    background: #ff4d6d;
    margin-right: 10px;
}

.no-button {
    background: #8d99ae;
    margin-left: 10px;
}

button:active {
    transform: scale(0.96);
}

/* ---------------- PHOTO ---------------- */

.photo-screen {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.photo {
    display: block;
    max-width: 360px;
    max-height: 520px;
    width: auto;
    height: auto;
    object-fit: contain;
}

/* ---------------- SHAYARI ---------------- */

.shayari-card {
    width: 100%;
    max-width: 350px;
    min-height: 300px;
    background: #ffffff;
    border: 1px solid #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.shayari-text {
    font-size: 13px;
    font-style: italic;
    color: #2b2d42;
    line-height: 1.6;
    max-width: 310px;
}

.shayari-text-small {
    font-size: 11px;
    font-style: italic;
    color: #2b2d42;
    line-height: 1.7;
    max-width: 310px;
}

/* ---------------- FINAL PHOTO ---------------- */

.final-photo {
    display: block;
    max-width: 350px;
    max-height: 400px;
    width: auto;
    height: auto;
    object-fit: contain;
}

.final-caption {
    font-size: 13px;
    font-weight: bold;
    color: #2b2d42;
    margin-top: 10px;
}

/* ---------------- FEEDBACK ---------------- */

.feedback-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 25px;
}

.feedback-main {
    font-size: 15px;
    font-weight: bold;
    max-width: 350px;
    line-height: 1.4;
    margin-bottom: 15px;
}

.feedback-sub {
    font-size: 12px;
    color: #4a4e69;
    max-width: 350px;
    line-height: 1.5;
}

/* ---------------- FINAL ---------------- */

.once-again {
    font-size: 14px;
    margin-bottom: 10px;
}

.final-birthday {
    font-size: 20px;
    font-weight: bold;
    color: #d90429;
    margin: 10px 0;
}

.keep-smiling {
    font-size: 14px;
    font-style: italic;
}

</style>
</head>

<body>

<div id="screen"></div>

<!-- MUSIC -->
<audio id="music" loop>
    <source
        src="https://thokeranjeet5-ux.github.io/birthday-surprise/sunehra.mp3"
        type="audio/mpeg">
</audio>

<script>

/* =====================================================
   GITHUB PAGES FILE PATHS
   ===================================================== */

const PHOTO1 =
"https://thokeranjeet5-ux.github.io/birthday-surprise/Photo1.jpg";

const PHOTO2 =
"https://thokeranjeet5-ux.github.io/birthday-surprise/Photo2.jpg";


const screen = document.getElementById("screen");
const music = document.getElementById("music");


/* ---------------- CLEAR SCREEN ---------------- */

function clearScreen() {
    screen.className = "";
    screen.innerHTML = "";
}


/* ---------------- OPENING ---------------- */

function startScreen() {

    clearScreen();

    screen.innerHTML = `

        <div class="opening-text">
            Do you want to see what I made for you?
        </div>

        <div class="button-row">

            <button
                class="yes-button"
                onclick="birthdayScreen()">
                YES
            </button>

            <button
                class="no-button"
                onclick="noOpening()">
                NO
            </button>

        </div>

    `;
}


/* ---------------- OPENING NO ---------------- */

function noOpening() {

    clearScreen();

    screen.innerHTML = `

        <div class="are-you-sure">
            Are you sure?
        </div>

        <button
            class="yes-button"
            onclick="birthdayScreen()">
            YES
        </button>

        <br>

        <button
            class="no-button"
            onclick="startScreen()">
            NO
        </button>

    `;
}


/* ---------------- BIRTHDAY ---------------- */

function birthdayScreen() {

    clearScreen();

    /* Start music after YES */
    music.play().catch(function(error) {
        console.log("Music could not start:", error);
    });

    screen.innerHTML = `

        <div class="birthday-title">
            HAPPY BIRTHDAY TO YOU
        </div>

        <div class="birthday-subtitle">
            A little surprise, just for you.
        </div>

    `;

    setTimeout(showPhoto1, 3000);
}


/* ---------------- PHOTO 1 ---------------- */

function showPhoto1() {

    clearScreen();

    screen.className = "photo-screen";

    screen.innerHTML = `

        <img
            src="${PHOTO1}"
            class="photo"
            alt="Photo 1"
        >

    `;

    setTimeout(showPhoto2, 5000);
}


/* ---------------- PHOTO 2 ---------------- */

function showPhoto2() {

    clearScreen();

    screen.className = "photo-screen";

    screen.innerHTML = `

        <img
            src="${PHOTO2}"
            class="photo"
            alt="Photo 2"
        >

    `;

    setTimeout(showShayari1, 5000);
}


/* ---------------- SHAYARI DISPLAY ---------------- */

function showShayari(text, small, seconds, nextScreen) {

    clearScreen();

    screen.innerHTML = `

        <div class="shayari-card">

            <div class="${small ? "shayari-text-small" : "shayari-text"}">
                ${text}
            </div>

        </div>

    `;

    setTimeout(nextScreen, seconds);
}


/* ---------------- SHAYARI 1 ---------------- */

function showShayari1() {

    const text = `
        Teri hansi mein kuch aisi baat hai,<br>
        Jise dekhu to dil ko milti ek khaas si rahat hai.
    `;

    showShayari(
        text,
        false,
        4500,
        showShayari2
    );
}


/* ---------------- SHAYARI 2 ---------------- */

function showShayari2() {

    const text = `
        Teri ek muskaan dil ko chhoo jaati hai,<br>
        Bina kuch kahe hi bahut kuch keh jaati hai.
    `;

    showShayari(
        text,
        false,
        4500,
        showShayari3
    );
}


/* ---------------- SHAYARI 3 ---------------- */

function showShayari3() {

    const text = `
        Aaj tere janmdin par bas itni si dua hai,<br>
        Tere chehre ki ye hansi hamesha yun hi khili rahe.<br><br>

        Har subah tere liye khushiyon ki saugaat laaye,<br>
        Aur teri ye muskaan har din aur bhi pyaari nazar aaye.
    `;

    showShayari(
        text,
        true,
        6500,
        finalPhoto
    );
}


/* ---------------- FINAL PHOTO ---------------- */

function finalPhoto() {

    clearScreen();

    screen.innerHTML = `

        <img
            src="${PHOTO2}"
            class="final-photo"
            alt="Final Photo"
        >

        <div class="final-caption">
            Ye hasi yunhi bekarar rahe.
        </div>

    `;

    setTimeout(feedbackScreen, 5000);
}


/* ---------------- FEEDBACK ---------------- */

function feedbackScreen() {

    clearScreen();

    screen.innerHTML = `

        <div class="feedback-title">
            Did you like it?
        </div>

        <div class="button-row">

            <button
                class="yes-button"
                onclick="yesFeedback()">
                YES
            </button>

            <button
                class="no-button"
                onclick="noFeedback()">
                NO
            </button>

        </div>

    `;
}


/* ---------------- YES FEEDBACK ---------------- */

function yesFeedback() {

    clearScreen();

    screen.innerHTML = `

        <div class="feedback-main">
            I'm glad you liked it.
        </div>

        <div class="feedback-sub">
            But honestly...<br>
            your smile was the only feedback I wanted.
        </div>

    `;

    setTimeout(finalEnding, 5000);
}


/* ---------------- NO FEEDBACK ---------------- */

function noFeedback() {

    clearScreen();

    screen.innerHTML = `

        <div class="feedback-main">
            Aww... I guess I couldn't<br>
            make you smile this time.
        </div>

        <div class="feedback-sub">
            I'll make it better next time.
        </div>

        <button
            class="yes-button"
            onclick="feedbackScreen()"
            style="margin-top:10px;">
            TRY AGAIN
        </button>

    `;
}


/* ---------------- FINAL ENDING ---------------- */

function finalEnding() {

    clearScreen();

    screen.innerHTML = `

        <div class="once-again">
            Once again...
        </div>

        <div class="final-birthday">
            HAPPY BIRTHDAY
        </div>

        <div class="keep-smiling">
            Keep smiling.
        </div>

    `;
}


/* ---------------- START ---------------- */

startScreen();

</script>

</body>
</html>
